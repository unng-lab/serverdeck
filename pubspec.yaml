name: serverdeck
description: ServerDeck brand and shared component library.
publish_to: none
version: 0.1.0+3
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pointycastle: 4.0.0
  dartssh2:
    path: third_party/dartssh2
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.4.1
  build_runner: 2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/mcp/tools.json
    - assets/brand/fonts/OFL.txt
    - assets/brand/fonts/OFL-NotoSansSC.txt
    - assets/brand/fonts/NotoSansSC-SOURCE.json
    - assets/brand/logos/logo-dark.png
    - assets/brand/logos/logo-light.png
    - assets/brand/logos/mark-dark.png
    - assets/brand/logos/mark-light.png
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/brand/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/brand/fonts/NotoSans-SemiBold.ttf
          weight: 600
    - family: Noto Sans Mono
      fonts:
        - asset: assets/brand/fonts/NotoSansMono-Regular.ttf
          weight: 400
    - family: Noto Sans SC
      fonts:
        - asset: assets/brand/fonts/NotoSansSC-Variable.ttf
