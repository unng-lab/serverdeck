publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  crypto: 3.0.7
  path: 1.9.1
  path_provider: 2.1.6
  package_info_plus: 10.2.2
  flutter_rustore_update: 10.5.3
  url_launcher: 6.3.3
  dartssh2: 4.1.0
