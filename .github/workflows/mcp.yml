name: MCP automatic checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run automatic checks or prepare exact recipe metadata only
        type: choice
        required: true
        default: checks
        options:
          - checks
          - prepare-recipes
  push:
    branches: ['feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  ssh-transport:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'prepare-recipes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Locked dependencies and portable SSH tests
        working-directory: packages/serverdeck_locald
        run: |
          dart pub get --enforce-lockfile
          dart analyze lib/remote/ssh_transport.dart test/ssh_transport_test.dart test/ssh_transport_container_test.dart
          dart test test/ssh_transport_test.dart --reporter expanded
      - name: Real disposable OpenSSH qualification
        run: bash tools/test-ssh-container.sh
  executor-prerequisites:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'prepare-recipes'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fixture cleanup on failed container start
        run: python3 -m unittest discover -s tools/tests -p test_executor_fixture_cleanup.py -v
      - name: Docker systemd and locked Ansible prerequisites
        run: bash tools/test-executor-container.sh
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'prepare-recipes'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned hosted MSVC
        shell: pwsh
        run: ./tools/prepare-foundation-hosted-msvc.ps1
      - name: Install verified pinned SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          Invoke-WebRequest 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.7-stable.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c2c875da25a1a1448d18ee4e8f398b2f6fce888b4775d8f9130538e16d826cb4') { throw 'SDK checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'foundation-sdk')
          "SERVERDECK_FLUTTER_ROOT=$(Join-Path $env:RUNNER_TEMP 'foundation-sdk/flutter')" >> $env:GITHUB_ENV
      - name: Prepare pinned SDK dependencies
        shell: pwsh
        run: ./tools/prepare-foundation-sdk.ps1
      - name: MCP transport checks
        shell: pwsh
        run: |
          . ./tools/foundation-sdk.ps1
          Push-Location packages/serverdeck_mcp
          try {
            Invoke-FoundationCommand $FoundationDart @('pub','get','--enforce-lockfile')
            Invoke-FoundationCommand $FoundationDart @('analyze')
            Invoke-FoundationCommand $FoundationDart @('test')
          } finally { Pop-Location }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare hash-locked loopback SSH fixture
        shell: pwsh
        run: |
          $fixturePython = & ./tools/prepare-trust-probe-fixture.ps1
          "SERVERDECK_TRUST_FIXTURE_PYTHON=$fixturePython" >> $env:GITHUB_ENV
      - name: Source-built native library and root/package automatic suites
        shell: pwsh
        run: ./tools/test-foundation-cold-runner.ps1
      - name: Preserve safe proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-automatic-safe-proof
          path: |
            .local/cold-runner-*/safe-*.json
            .local/native-qualification-*/safe-*.json
            .local/native-build-progress-*/safe-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  recipe-preparation:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'prepare-recipes'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signed exact-version metadata without installing applications
        run: bash tools/test-executor-container.sh prepare-recipes
      - name: Retain public catalog and preparation provenance
        uses: actions/upload-artifact@v4
        with:
          name: recipe-catalog-preparation
          path: .local/recipe-catalog-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
