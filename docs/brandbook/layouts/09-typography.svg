="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">14 / 20 px</text><text x="1040" y="456" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">400</text><line x1="56" y1="479" x2="1384" y2="479" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="521" font-family="Noto Sans" font-size="20" font-weight="400" fill="#172337">Таблица и журнал</text><text x="662" y="521" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">13 / 20 px</text><text x="1040" y="521" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">400</text><line x1="56" y1="544" x2="1384" y2="544" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="586" font-family="Noto Sans" font-size="20" font-weight="400" fill="#172337">Подпись и метаданные</text><text x="662" y="586" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">12 / 16 px</text><text x="1040" y="586" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">400</text><line x1="56" y1="609" x2="1384" y2="609" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="651" font-family="Noto Sans" font-size="20" font-weight="400" fill="#172337">Кнопки и заголовки таблиц</text><text x="662" y="651" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">13 / 20 px</text><text x="1040" y="651" font-family="Noto Sans Mono" font-size="20" font-weight="400" fill="#172337">600</text><line x1="56" y1="674" x2="1384" y2="674" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="748" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Размеры интерфейса в логических px Flutter. Масштаб текста до 200%: перенос, прокрутка и увеличение строк вместо обрезки. В таблицах</text><text x="56" y="775.9" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">числа выравнивать вправо, версии и команды - моноширинным шрифтом.</text></svg>