<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Тексты называют действие и последствия</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FA" stroke="none" stroke-width="1"/><text x="56" y="46" font-family="Noto Sans" font-size="12" font-weight="600" fill="#526279">SERVERDECK  /  ГОЛОС БРЕНДА</text><text x="56" y="96" font-family="Noto Sans" font-size="36" font-weight="600" fill="#172337">Тексты называют действие и последствия</text><line x1="56" y1="850" x2="1384" y2="850" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="874" font-family="Noto Sans" font-size="11" font-weight="400" fill="#526279">Брендбук 1.1  /  10.10.2026</text><text x="1330" y="874" font-family="Noto Sans Mono" font-size="11" font-weight="400" fill="#526279">26</text><text x="56" y="175" font-family="Noto Sans" font-size="23" font-weight="400" fill="#172337">Профессионально, коротко и спокойно. Сначала результат или проблема, затем следующий шаг. Не</text><text x="56" y="210.65" font-family="Noto Sans" font-size="23" font-weight="400" fill="#172337">обвиняем пользователя, не скрываем причину и не выдаём предположение за факт.</text><text x="56" y="331" font-family="Noto Sans" font-size="18" font-weight="600" fill="#172337">Кнопка</text><text x="284" y="331" font-family="Noto Sans" font-size="17" font-weight="400" fill="#172337">Обновить PostgreSQL</text><text x="1055" y="331" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">Выполнить магию</text><line x1="56" y1="389" x2="1384" y2="389" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="423" font-family="Noto Sans" font-size="18" font-weight="600" fill="#172337">Подтверждение</text><text x="284" y="423" font-family="Noto Sans" font-size="17" font-weight="400" fill="#172337">Перезапустить nginx на lab-a? Активные соединения могут прерваться.</text><text x="1055" y="423" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">Вы уверены?</text><line x1="56" y1="481" x2="1384" y2="481" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="515" font-family="Noto Sans" font-size="18" font-weight="600" fill="#172337">Ошибка</text><text x="284" y="515" font-family="Noto Sans" font-size="17" font-weight="400" fill="#172337">Не удалось подключиться: истекло время ожидания. Проверить адрес и сеть.</text><text x="1055" y="515" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">Что-то пошло не так</text><line x1="56" y1="573" x2="1384" y2="573" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="607" font-family="Noto Sans" font-size="18" font-weight="600" fill="#172337">Успех</text><text x="284" y="607" font-family="Noto Sans" font-size="17" font-weight="400" fill="#172337">Nginx обновлён до 1.26.2. Служба запущена.</text><text x="1055" y="607" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">Всё отлично!</text><line x1="56" y1="665" x2="1384" y2="665" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="699" font-family="Noto Sans" font-size="18" font-weight="600" fill="#172337">Нет данных</text><text x="284" y="699" font-family="Noto Sans" font-size="17" font-weight="400" fill="#172337">Метрики ещё не получены. Повторить проверку.</text><text x="1055" y="699" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">CPU: 0%</text><line x1="56" y1="757" x2="1384" y2="757" stroke="#CDD7E4" stroke-width="1"/></svg>