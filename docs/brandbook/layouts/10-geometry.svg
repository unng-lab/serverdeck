<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Геометрия, иконки и глубина</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FA" stroke="none" stroke-width="1"/><text x="56" y="46" font-family="Noto Sans" font-size="12" font-weight="600" fill="#526279">SERVERDECK  /  ОСНОВЫ ИНТЕРФЕЙСА</text><text x="56" y="96" font-family="Noto Sans" font-size="36" font-weight="600" fill="#172337">Геометрия, иконки и глубина</text><line x1="56" y1="850" x2="1384" y2="850" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="874" font-family="Noto Sans" font-size="11" font-weight="400" fill="#526279">Брендбук 1.1  /  10.10.2026</text><text x="1330" y="874" font-family="Noto Sans Mono" font-size="11" font-weight="400" fill="#526279">10</text><rect x="56" y="190" width="120" height="4" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="56" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">4 px</text><rect x="238" y="190" width="120" height="8" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="238" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">8 px</text><rect x="420" y="190" width="120" height="12" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="420" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">12 px</text><rect x="602" y="190" width="120" height="16" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="602" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">16 px</text><rect x="784" y="190" width="120" height="24" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="784" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">24 px</text><rect x="966" y="190" width="120" height="32" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="966" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">32 px</text><rect x="1148" y="190" width="120" height="48" rx="0" fill="#087565" stroke="none" stroke-width="1"/><text x="1148" y="273" font-family="Noto Sans Mono" font-size="19" font-weight="400" fill="#172337">48 px</text><text x="56" y="340" font-family="Noto Sans" font-size="25" font-weight="600" fill="#172337">Сетка</text><text x="56" y="387" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Базовый шаг 4 px. Внешний отступ 24, между блоками 24, внутри</text><text x="56" y="414.9" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">карточки 16. Навигация 210 px. Минимальный рабочий экран 1000 ×</text><text x="56" y="442.79999999999995" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">700; ниже - компактная навигация и горизонтальная прокрутка</text><text x="56" y="470.69999999999993" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">таблиц.</text><text x="732" y="340" font-family="Noto Sans" font-size="25" font-weight="600" fill="#172337">Скругления</text><text x="732" y="387" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Поле и кнопка 8 px. Карточка 12 px. Диалог 16 px. Таблицы внутри</text><text x="732" y="414.9" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">одного контейнера. Не скруглять каждую строку.</text><text x="56" y="576" font-family="Noto Sans" font-size="25" font-weight="600" fill="#172337">Иконки</text><text x="56" y="623" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Контур 1.5 px на сетке 20 × 20, в крупных кнопках 24 × 24.</text><text x="56" y="650.9" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Одинаковые окончания и оптический вес. Значимые действия</text><text x="56" y="678.8" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">сопровождаются подписью; одиночные иконки имеют tooltip и</text><text x="56" y="706.6999999999999" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">semanticsLabel.</text><text x="732" y="576" font-family="Noto Sans" font-size="25" font-weight="600" fill="#172337">Тени и движение</text><text x="732" y="623" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Тёмная тема: без теней, глубина через поверхность и границу.</text><text x="732" y="650.9" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Светлая: тень только для меню и диалога, 0 / 4 / 16 px, 10%. Переходы</text><text x="732" y="678.8" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">120-180 мс. При reduced motion выключать циклическую анимацию.</text></svg>