<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Спокойствие, основанное на ясности</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FA" stroke="none" stroke-width="1"/><text x="56" y="46" font-family="Noto Sans" font-size="12" font-weight="600" fill="#526279">SERVERDECK  /  ПОЗИЦИОНИРОВАНИЕ</text><text x="56" y="96" font-family="Noto Sans" font-size="36" font-weight="600" fill="#172337">Спокойствие, основанное на ясности</text><line x1="56" y1="850" x2="1384" y2="850" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="874" font-family="Noto Sans" font-size="11" font-weight="400" fill="#526279">Брендбук 1.1  /  10.10.2026</text><text x="1330" y="874" font-family="Noto Sans Mono" font-size="11" font-weight="400" fill="#526279">02</text><text x="56" y="176" font-family="Noto Sans" font-size="25" font-weight="400" fill="#172337">ServerDeck объединяет серверы, ПО, версии, журналы, ресурсы</text><text x="56" y="214.75" font-family="Noto Sans" font-size="25" font-weight="400" fill="#172337">и задания. Инженер видит состояние инфраструктуры и</text><text x="56" y="253.5" font-family="Noto Sans" font-size="25" font-weight="400" fill="#172337">понимает последствия каждого изменения.</text><rect x="56" y="365" width="640" height="162" rx="12" fill="#FFFFFF" stroke="#CDD7E4" stroke-width="1"/><text x="80" y="408" font-family="Noto Sans" font-size="24" font-weight="600" fill="#172337">Контроль</text><text x="80" y="447" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Статус, источник данных и время проверки рядом с результатом.</text><rect x="732" y="365" width="640" height="162" rx="12" fill="#FFFFFF" stroke="#CDD7E4" stroke-width="1"/><text x="756" y="408" font-family="Noto Sans" font-size="24" font-weight="600" fill="#172337">Прозрачность</text><text x="756" y="447" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Показываем этапы задания, ошибки и доступные действия.</text><rect x="56" y="555" width="640" height="162" rx="12" fill="#FFFFFF" stroke="#CDD7E4" stroke-width="1"/><text x="80" y="598" font-family="Noto Sans" font-size="24" font-weight="600" fill="#172337">Порядок</text><text x="80" y="637" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Одна структура экранов и единые обозначения в обеих темах.</text><rect x="732" y="555" width="640" height="162" rx="12" fill="#FFFFFF" stroke="#CDD7E4" stroke-width="1"/><text x="756" y="598" font-family="Noto Sans" font-size="24" font-weight="600" fill="#172337">Надёжность</text><text x="756" y="637" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Не обещаем защиту, которую продукт не обеспечивает.</text><text x="56" y="803" font-family="Noto Sans" font-size="16" font-weight="400" fill="#526279">Аудитория: системные администраторы, DevOps, разработчики, владельцы небольших инфраструктур.</text></svg>