<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Плотные данные и доступные графики</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FA" stroke="none" stroke-width="1"/><text x="56" y="46" font-family="Noto Sans" font-size="12" font-weight="600" fill="#526279">SERVERDECK  /  ПОВЕДЕНИЕ</text><text x="56" y="96" font-family="Noto Sans" font-size="36" font-weight="600" fill="#172337">Плотные данные и доступные графики</text><line x1="56" y1="850" x2="1384" y2="850" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="874" font-family="Noto Sans" font-size="11" font-weight="400" fill="#526279">Брендбук 1.1  /  10.10.2026</text><text x="1330" y="874" font-family="Noto Sans Mono" font-size="11" font-weight="400" fill="#526279">25</text><text x="56" y="194" font-family="Noto Sans" font-size="26" font-weight="600" fill="#172337">Таблицы</text><text x="56" y="244" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">Строки 36 px в плотном режиме и 44 px по умолчанию.</text><text x="56" y="273.45" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">Закреплять заголовок; имя сервера - при горизонтальной</text><text x="56" y="302.9" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">прокрутке. Сортировка имеет направление и semantics. Обрезка</text><text x="56" y="332.34999999999997" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">имени допустима только с полным значением в tooltip и</text><text x="56" y="361.79999999999995" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">копированием.</text><text x="732" y="194" font-family="Noto Sans" font-size="26" font-weight="600" fill="#172337">Журналы</text><text x="732" y="244" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">Моноширинный текст 13/20 px. Сохранять переносы и пробелы.</text><text x="732" y="273.45" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">По умолчанию горизонтальная прокрутка; перенос строк</text><text x="732" y="302.9" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">включается отдельно. При ручной прокрутке вверх</text><text x="732" y="332.34999999999997" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">приостанавливать следование хвосту. ERROR и WARN видны как</text><text x="732" y="361.79999999999995" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">текст.</text><text x="56" y="486" font-family="Noto Sans" font-size="26" font-weight="600" fill="#172337">Графики</text><text x="56" y="536" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">CPU: сплошная линия и круг. RAM: штрих и квадрат. Диск: точки и</text><text x="56" y="565.45" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">треугольник. Ось с единицами, период и часовой пояс</text><text x="56" y="594.9000000000001" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">обязательны. Tooltip доступен клавиатурой; рядом открывается</text><text x="56" y="624.3500000000001" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">таблица значений. Нет данных - разрыв, а не ноль.</text><text x="732" y="486" font-family="Noto Sans" font-size="26" font-weight="600" fill="#172337">Клавиатура и масштаб</text><text x="732" y="536" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">Tab следует визуальному порядку. Enter запускает выбранное</text><text x="732" y="565.45" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">действие; Escape закрывает меню. Фокус не перекрывается</text><text x="732" y="594.9000000000001" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">панелями. У интерактивной цели минимум 24 × 24 px, стандарт</text><text x="732" y="624.3500000000001" font-family="Noto Sans" font-size="19" font-weight="400" fill="#172337">36 px. Статус операции объявляется через Semantics liveRegion.</text></svg>