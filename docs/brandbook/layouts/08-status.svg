<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Статус всегда имеет цвет, символ и подпись</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FA" stroke="none" stroke-width="1"/><text x="56" y="46" font-family="Noto Sans" font-size="12" font-weight="600" fill="#526279">SERVERDECK  /  СЕМАНТИКА</text><text x="56" y="96" font-family="Noto Sans" font-size="36" font-weight="600" fill="#172337">Статус всегда имеет цвет, символ и подпись</text><line x1="56" y1="850" x2="1384" y2="850" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="874" font-family="Noto Sans" font-size="11" font-weight="400" fill="#526279">Брендбук 1.1  /  10.10.2026</text><text x="1330" y="874" font-family="Noto Sans Mono" font-size="11" font-weight="400" fill="#526279">08</text><text x="56" y="169" font-family="Noto Sans" font-size="16" font-weight="600" fill="#526279">Состояние</text><text x="402" y="169" font-family="Noto Sans" font-size="16" font-weight="600" fill="#526279">Тёмный / светлый</text><text x="787" y="169" font-family="Noto Sans" font-size="16" font-weight="600" fill="#526279">Значение</text><circle cx="70" cy="203" r="6.825" fill="none" stroke="#137346" stroke-width="2"/><circle cx="70" cy="203" r="2" fill="#137346" stroke="#137346" stroke-width="1.5"/><text x="102" y="208" font-family="Noto Sans" font-size="20" font-weight="600" fill="#172337">Доступен</text><text x="402" y="208" font-family="Noto Sans Mono" font-size="18" font-weight="400" fill="#172337">#72DBAC / #137346</text><text x="787" y="208" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">SSH-соединение установлено</text><line x1="56" y1="233" x2="1384" y2="233" stroke="#CDD7E4" stroke-width="1"/><line x1="63.7" y1="269.7" x2="76.3" y2="282.3" stroke="#B62D42" stroke-width="2"/><line x1="76.3" y1="269.7" x2="63.7" y2="282.3" stroke="#B62D42" stroke-width="2"/><text x="102" y="281" font-family="Noto Sans" font-size="20" font-weight="600" fill="#172337">Недоступен</text><text x="402" y="281" font-family="Noto Sans Mono" font-size="18" font-weight="400" fill="#172337">#FF9DA5 / #B62D42</text><text x="787" y="281" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Подключение не установлено</text><line x1="56" y1="306" x2="1384" y2="306" stroke="#CDD7E4" stroke-width="1"/><circle cx="70" cy="349" r="10.5" fill="none" stroke="#586579" stroke-width="1.5"/><text x="65.8" y="354.775" font-family="Noto Sans" font-size="18.900000000000002" font-weight="600" fill="#586579">?</text><text x="102" y="354" font-family="Noto Sans" font-size="20" font-weight="600" fill="#172337">Неизвестно</text><text x="402" y="354" font-family="Noto Sans Mono" font-size="18" font-weight="400" fill="#172337">#BCC7D6 / #586579</text><text x="787" y="354" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Данные ещё не получены</text><line x1="56" y1="379" x2="1384" y2="379" stroke="#CDD7E4" stroke-width="1"/><line x1="70.0" y1="411.5" x2="79.0932667397366" y2="427.25" stroke="#915000" stroke-width="1.5"/><line x1="79.0932667397366" y1="427.25" x2="60.906733260263394" y2="427.25" stroke="#915000" stroke-width="1.5"/><line x1="60.906733260263394" y1="427.25" x2="70.0" y2="411.5" stroke="#915000" stroke-width="1.5"/><text x="67.5" y="426" font-family="Noto Sans" font-size="11" font-weight="600" fill="#915000">!</text><text x="102" y="427" font-family="Noto Sans" font-size="20" font-weight="600" fill="#172337">Предупреждение</text><text x="402" y="427" font-family="Noto Sans Mono" font-size="18" font-weight="400" fill="#172337">#FFC47A / #915000</text><text x="787" y="427" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Требуется внимание</text><line x1="56" y1="452" x2="1384" y2="452" stroke="#CDD7E4" stroke-width="1"/><line x1="70.0" y1="484.5" x2="77.42462120245875" y2="487.57537879754125" stroke="#B6203C" stroke-width="1.5"/><line x1="77.42462120245875" y1="487.575