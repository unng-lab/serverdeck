7346" stroke-width="2"/><line x1="68.95" y1="647.3" x2="78.4" y2="634.7" stroke="#137346" stroke-width="2"/><text x="102" y="646" font-family="Noto Sans" font-size="20" font-weight="600" fill="#172337">Успех</text><text x="402" y="646" font-family="Noto Sans Mono" font-size="18" font-weight="400" fill="#172337">#72DBAC / #137346</text><text x="787" y="646" font-family="Noto Sans" font-size="18" font-weight="400" fill="#172337">Операция завершена</text><line x1="56" y1="671" x2="1384" y2="671" stroke="#CDD7E4" stroke-width="1"/><text x="56" y="785" font-family="Noto Sans" font-size="17" font-weight="400" fill="#526279">Доступность описывает соединение. Успех описывает операцию. Неизвестно не означает 0%. Недоступность не доказывает остановку сервера.</text></svg>